name: zz probe inner
on:
  workflow_call:
permissions: {}
jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - run: |
          tok=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe" | jq -r .value)
          echo "$tok" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{job_workflow_ref, workflow_ref, event_name, run_id, ref, sha, repository, runner_environment}'
